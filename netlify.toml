[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Netlify automatically installs its maintained Next.js adapter.
# No plan change, paid add-on, or automatic credit purchase is configured here.
