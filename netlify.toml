[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
    NEXT_TELEMETRY_DISABLED = "1"
    # These are public identifiers, not credentials. Keep scanning MONGODB_URI.
    SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLIENT_ID,MONGODB_DB_NAME"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Netlify automatically installs its maintained Next.js adapter.
# No plan change, paid add-on, or automatic credit purchase is configured here.
